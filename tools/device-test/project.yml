name: HackDeviceTest
options:
  bundleIdPrefix: com.peep
settings:
  base:
    DEVELOPMENT_TEAM: 3276G27R59
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
targets:
  TestHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peep.hack.testhost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DeviceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peep.hack.deviceuitests
        TEST_TARGET_NAME: TestHost
schemes:
  DeviceUITests:
    build:
      targets:
        TestHost: all
        DeviceUITests: [test]
    test:
      targets: [DeviceUITests]
